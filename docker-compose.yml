services:
  # PostgreSQL Database
  db:
    image: postgres:18-alpine
    container_name: pulsartrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsartrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-pulsartrack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Postgres only runs .sql/.sh files here; the app also applies this schema
      # and any migrations on startup (backend/src/db/migrate.ts).
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsartrack"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - pulsartrack-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pulsartrack-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$REDIS_PASSWORD" ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - pulsartrack-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pulsartrack-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulsartrack}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-pulsartrack}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379

      # Authentication
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}

      # Stellar Network
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org

      # Contract IDs (placeholder - update with actual deployed contract IDs)
      CONTRACT_ACCESS_CONTROL: ${CONTRACT_ACCESS_CONTROL:-PLACEHOLDER}
      CONTRACT_AD_REGISTRY: ${CONTRACT_AD_REGISTRY:-PLACEHOLDER}
      CONTRACT_ANALYTICS_AGGREGATOR: ${CONTRACT_ANALYTICS_AGGREGATOR:-PLACEHOLDER}
      CONTRACT_ANOMALY_DETECTOR: ${CONTRACT_ANOMALY_DETECTOR:-PLACEHOLDER}
      CONTRACT_AUCTION_ENGINE: ${CONTRACT_AUCTION_ENGINE:-PLACEHOLDER}
      CONTRACT_AUDIENCE_SEGMENTS: ${CONTRACT_AUDIENCE_SEGMENTS:-PLACEHOLDER}
      CONTRACT_BUDGET_OPTIMIZER: ${CONTRACT_BUDGET_OPTIMIZER:-PLACEHOLDER}
      CONTRACT_CAMPAIGN_ANALYTICS: ${CONTRACT_CAMPAIGN_ANALYTICS:-PLACEHOLDER}
      CONTRACT_CAMPAIGN_LIFECYCLE: ${CONTRACT_CAMPAIGN_LIFECYCLE:-PLACEHOLDER}
      CONTRACT_CAMPAIGN_ORCHESTRATOR: ${CONTRACT_CAMPAIGN_ORCHESTRATOR:-PLACEHOLDER}
      CONTRACT_CREATIVE_MARKETPLACE: ${CONTRACT_CREATIVE_MARKETPLACE:-PLACEHOLDER}
      CONTRACT_DISPUTE_RESOLUTION: ${CONTRACT_DISPUTE_RESOLUTION:-PLACEHOLDER}
      CONTRACT_ESCROW_VAULT: ${CONTRACT_ESCROW_VAULT:-PLACEHOLDER}
      CONTRACT_FRAUD_PREVENTION: ${CONTRACT_FRAUD_PREVENTION:-PLACEHOLDER}
      CONTRACT_GOVERNANCE_CORE: ${CONTRACT_GOVERNANCE_CORE:-PLACEHOLDER}
      CONTRACT_GOVERNANCE_DAO: ${CONTRACT_GOVERNANCE_DAO:-PLACEHOLDER}
      CONTRACT_GOVERNANCE_TOKEN: ${CONTRACT_GOVERNANCE_TOKEN:-PLACEHOLDER}
      CONTRACT_IDENTITY_REGISTRY: ${CONTRACT_IDENTITY_REGISTRY:-PLACEHOLDER}
      CONTRACT_KYC_REGISTRY: ${CONTRACT_KYC_REGISTRY:-PLACEHOLDER}
      CONTRACT_LIQUIDITY_POOL: ${CONTRACT_LIQUIDITY_POOL:-PLACEHOLDER}
      CONTRACT_MILESTONE_TRACKER: ${CONTRACT_MILESTONE_TRACKER:-PLACEHOLDER}
      CONTRACT_MULTISIG_TREASURY: ${CONTRACT_MULTISIG_TREASURY:-PLACEHOLDER}
      CONTRACT_ORACLE_INTEGRATION: ${CONTRACT_ORACLE_INTEGRATION:-PLACEHOLDER}
      CONTRACT_PAYMENT_PROCESSOR: ${CONTRACT_PAYMENT_PROCESSOR:-PLACEHOLDER}
      CONTRACT_PAYOUT_AUTOMATION: ${CONTRACT_PAYOUT_AUTOMATION:-PLACEHOLDER}
      CONTRACT_PERFORMANCE_ORACLE: ${CONTRACT_PERFORMANCE_ORACLE:-PLACEHOLDER}
      CONTRACT_PRIVACY_LAYER: ${CONTRACT_PRIVACY_LAYER:-PLACEHOLDER}
      CONTRACT_PUBLISHER_NETWORK: ${CONTRACT_PUBLISHER_NETWORK:-PLACEHOLDER}
      CONTRACT_PUBLISHER_REPUTATION: ${CONTRACT_PUBLISHER_REPUTATION:-PLACEHOLDER}
      CONTRACT_PUBLISHER_VERIFICATION: ${CONTRACT_PUBLISHER_VERIFICATION:-PLACEHOLDER}
      CONTRACT_RECURRING_PAYMENT: ${CONTRACT_RECURRING_PAYMENT:-PLACEHOLDER}
      CONTRACT_REFUND_PROCESSOR: ${CONTRACT_REFUND_PROCESSOR:-PLACEHOLDER}
      CONTRACT_REVENUE_SETTLEMENT: ${CONTRACT_REVENUE_SETTLEMENT:-PLACEHOLDER}
      CONTRACT_REWARDS_DISTRIBUTOR: ${CONTRACT_REWARDS_DISTRIBUTOR:-PLACEHOLDER}
      CONTRACT_SUBSCRIPTION_BENEFITS: ${CONTRACT_SUBSCRIPTION_BENEFITS:-PLACEHOLDER}
      CONTRACT_SUBSCRIPTION_MANAGER: ${CONTRACT_SUBSCRIPTION_MANAGER:-PLACEHOLDER}
      CONTRACT_TARGETING_ENGINE: ${CONTRACT_TARGETING_ENGINE:-PLACEHOLDER}
      CONTRACT_TIMELOCK_EXECUTOR: ${CONTRACT_TIMELOCK_EXECUTOR:-PLACEHOLDER}
      CONTRACT_TOKEN_BRIDGE: ${CONTRACT_TOKEN_BRIDGE:-PLACEHOLDER}
      CONTRACT_TREASURY_MANAGER: ${CONTRACT_TREASURY_MANAGER:-PLACEHOLDER}
      CONTRACT_VESTING_SCHEDULE: ${CONTRACT_VESTING_SCHEDULE:-PLACEHOLDER}
      CONTRACT_WHITELIST_REGISTRY: ${CONTRACT_WHITELIST_REGISTRY:-PLACEHOLDER}
      CONTRACT_WRAPPED_TOKEN: ${CONTRACT_WRAPPED_TOKEN:-PLACEHOLDER}

      # API Configuration
      CORS_ORIGIN: http://localhost:3000
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/prisma:/app/prisma:ro
    networks:
      - pulsartrack-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Next.js App
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runner
      # NEXT_PUBLIC_* vars must be present at image-build time so Next.js can
      # inline them into the client bundle during `next build`.  They are sourced
      # from the same .env file used at runtime (docker-compose reads .env
      # automatically).  See frontend/Dockerfile for the corresponding ARG/ENV
      # declarations in the builder stage.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_WS_URL: ws://localhost:3001
        NEXT_PUBLIC_NETWORK: testnet
        NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
        NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
        NEXT_PUBLIC_SIMULATION_ACCOUNT: GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWN
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_CONTRACT_AD_REGISTRY: ${CONTRACT_AD_REGISTRY:-PLACEHOLDER}
        NEXT_PUBLIC_CONTRACT_ANALYTICS_AGGREGATOR: ${CONTRACT_ANALYTICS_AGGREGATOR:-PLACEHOLDER}
        NEXT_PUBLIC_CONTRACT_AUCTION_ENGINE: ${CONTRACT_AUCTION_ENGINE:-PLACEHOLDER}
        NEXT_PUBLIC_CONTRACT_CAMPAIGN_ORCHESTRATOR: ${CONTRACT_CAMPAIGN_ORCHESTRATOR:-PLACEHOLDER}
        NEXT_PUBLIC_CONTRACT_DISPUTE_RESOLUTION: ${CONTRACT_DISPUTE_RESOLUTION:-PLACEHOLDER}
        NEXT_PUBLIC_CONTRACT_ESCROW_VAULT: ${CONTRACT_ESCROW_VAULT:-PLACEHOLDER}
        NEXT_PUBLIC_CONTRACT_FRAUD_PREVENTION: ${CONTRACT_FRAUD_PREVENTION:-PLACEHOLDER}
        NEXT_PUBLIC_CONTRACT_GOVERNANCE_DAO: ${CONTRACT_GOVERNANCE_DAO:-PLACEHOLDER}
        NEXT_PUBLIC_CONTRACT_GOVERNANCE_TOKEN: ${CONTRACT_GOVERNANCE_TOKEN:-PLACEHOLDER}
        NEXT_PUBLIC_CONTRACT_IDENTITY_REGISTRY: ${CONTRACT_IDENTITY_REGISTRY:-PLACEHOLDER}
        NEXT_PUBLIC_CONTRACT_PAYMENT_PROCESSOR: ${CONTRACT_PAYMENT_PROCESSOR:-PLACEHOLDER}
        NEXT_PUBLIC_CONTRACT_PRIVACY_LAYER: ${CONTRACT_PRIVACY_LAYER:-PLACEHOLDER}
        NEXT_PUBLIC_CONTRACT_PUBLISHER_REPUTATION: ${CONTRACT_PUBLISHER_REPUTATION:-PLACEHOLDER}
        NEXT_PUBLIC_CONTRACT_PUBLISHER_VERIFICATION: ${CONTRACT_PUBLISHER_VERIFICATION:-PLACEHOLDER}
        NEXT_PUBLIC_CONTRACT_REVENUE_SETTLEMENT: ${CONTRACT_REVENUE_SETTLEMENT:-PLACEHOLDER}
        NEXT_PUBLIC_CONTRACT_REWARDS_DISTRIBUTOR: ${CONTRACT_REWARDS_DISTRIBUTOR:-PLACEHOLDER}
        NEXT_PUBLIC_CONTRACT_SUBSCRIPTION_MANAGER: ${CONTRACT_SUBSCRIPTION_MANAGER:-PLACEHOLDER}
        NEXT_PUBLIC_CONTRACT_TARGETING_ENGINE: ${CONTRACT_TARGETING_ENGINE:-PLACEHOLDER}
    container_name: pulsartrack-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production

    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pulsartrack-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const h=require('http');h.get('http://localhost:3000',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  pulsartrack-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
