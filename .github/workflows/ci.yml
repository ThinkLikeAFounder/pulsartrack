name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Contracts CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Cache workspace crates in addition to dependencies for faster rebuilds
          # in a 45-crate workspace where internal crates change less frequently
          cache-workspace-crates: "true"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build contracts
        run: cargo build --workspace
      - name: Build contracts for WASM
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Run contract tests
        run: cargo test --workspace

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install workspace dependencies
        run: npm ci
      - name: Build shared packages
        run: npm run build:shared
      - name: Lint backend
        run: npm run lint
        working-directory: backend
      - name: Type check backend
        run: npm run typecheck
        working-directory: backend
      - name: Build backend
        run: npm run build
        working-directory: backend
      - name: Run backend tests with coverage
        run: npm run test:coverage
        working-directory: backend
      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 14

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install workspace dependencies
        run: npm ci
      - name: Build shared packages
        run: npm run build:shared
      - name: Type check frontend
        run: npm run typecheck
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Validate Docker env vars
        run: npm run validate:docker-env
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Run frontend tests with coverage
        run: npm run test:coverage -- --run
        working-directory: frontend
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # #1109 — Values for all REQUIRED_ENV_VARS so the frontend production
      # server can start under `next start` for E2E tests.
      # Every NEXT_PUBLIC_CONTRACT_* uses a syntactically valid (StrKey-
      # checksummed) but undeployed contract id, so `new Contract(...)` constructs
      # without throwing for any flow; real RPC calls are mocked by the specs.
      NEXT_PUBLIC_NETWORK: testnet
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_CONTRACT_AD_REGISTRY: CBRMBFTYTXZCORHZRHSBG5OWFUHDZZLGULAM6EERQYKPKJKGFKQTAMQV
      NEXT_PUBLIC_CONTRACT_ANALYTICS_AGGREGATOR: CBRMBFTYTXZCORHZRHSBG5OWFUHDZZLGULAM6EERQYKPKJKGFKQTAMQV
      NEXT_PUBLIC_CONTRACT_AUCTION_ENGINE: CBRMBFTYTXZCORHZRHSBG5OWFUHDZZLGULAM6EERQYKPKJKGFKQTAMQV
      NEXT_PUBLIC_CONTRACT_CAMPAIGN_ORCHESTRATOR: CBRMBFTYTXZCORHZRHSBG5OWFUHDZZLGULAM6EERQYKPKJKGFKQTAMQV
      NEXT_PUBLIC_CONTRACT_DISPUTE_RESOLUTION: CBRMBFTYTXZCORHZRHSBG5OWFUHDZZLGULAM6EERQYKPKJKGFKQTAMQV
      NEXT_PUBLIC_CONTRACT_ESCROW_VAULT: CBRMBFTYTXZCORHZRHSBG5OWFUHDZZLGULAM6EERQYKPKJKGFKQTAMQV
      NEXT_PUBLIC_CONTRACT_FRAUD_PREVENTION: CBRMBFTYTXZCORHZRHSBG5OWFUHDZZLGULAM6EERQYKPKJKGFKQTAMQV
      NEXT_PUBLIC_CONTRACT_GOVERNANCE_DAO: CBRMBFTYTXZCORHZRHSBG5OWFUHDZZLGULAM6EERQYKPKJKGFKQTAMQV
      NEXT_PUBLIC_CONTRACT_GOVERNANCE_TOKEN: CBRMBFTYTXZCORHZRHSBG5OWFUHDZZLGULAM6EERQYKPKJKGFKQTAMQV
      NEXT_PUBLIC_CONTRACT_IDENTITY_REGISTRY: CBRMBFTYTXZCORHZRHSBG5OWFUHDZZLGULAM6EERQYKPKJKGFKQTAMQV
      NEXT_PUBLIC_CONTRACT_PAYMENT_PROCESSOR: CBRMBFTYTXZCORHZRHSBG5OWFUHDZZLGULAM6EERQYKPKJKGFKQTAMQV
      NEXT_PUBLIC_CONTRACT_PRIVACY_LAYER: CBRMBFTYTXZCORHZRHSBG5OWFUHDZZLGULAM6EERQYKPKJKGFKQTAMQV
      NEXT_PUBLIC_CONTRACT_PUBLISHER_REPUTATION: CBRMBFTYTXZCORHZRHSBG5OWFUHDZZLGULAM6EERQYKPKJKGFKQTAMQV
      NEXT_PUBLIC_CONTRACT_PUBLISHER_VERIFICATION: CBRMBFTYTXZCORHZRHSBG5OWFUHDZZLGULAM6EERQYKPKJKGFKQTAMQV
      NEXT_PUBLIC_CONTRACT_REVENUE_SETTLEMENT: CBRMBFTYTXZCORHZRHSBG5OWFUHDZZLGULAM6EERQYKPKJKGFKQTAMQV
      NEXT_PUBLIC_CONTRACT_REWARDS_DISTRIBUTOR: CBRMBFTYTXZCORHZRHSBG5OWFUHDZZLGULAM6EERQYKPKJKGFKQTAMQV
      NEXT_PUBLIC_CONTRACT_SUBSCRIPTION_MANAGER: CBRMBFTYTXZCORHZRHSBG5OWFUHDZZLGULAM6EERQYKPKJKGFKQTAMQV
      NEXT_PUBLIC_CONTRACT_TARGETING_ENGINE: CBRMBFTYTXZCORHZRHSBG5OWFUHDZZLGULAM6EERQYKPKJKGFKQTAMQV
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install workspace dependencies
        run: npm ci
      - name: Build shared packages
        run: npm run build:shared
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: frontend
