name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Contracts CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Cache workspace crates in addition to dependencies for faster rebuilds
          # in a 45-crate workspace where internal crates change less frequently
          cache-workspace-crates: "true"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build contracts
        run: cargo build --workspace
      - name: Build contracts for WASM
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Run contract tests
        run: cargo test --workspace

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install workspace dependencies
        run: npm ci
      - name: Build shared packages
        run: npm run build:shared
      - name: Lint backend
        run: npm run lint
        working-directory: backend
      - name: Type check backend
        run: npm run typecheck
        working-directory: backend
      - name: Build backend
        run: npm run build
        working-directory: backend
      - name: Run backend tests
        run: npm test
        working-directory: backend

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install workspace dependencies
        run: npm ci
      - name: Build shared packages
        run: npm run build:shared
      - name: Type check frontend
        run: npm run typecheck
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Validate Docker env vars
        run: npm run validate:docker-env
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Run frontend tests
        run: npm test
        working-directory: frontend

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # #1109 — Placeholder values for all REQUIRED_ENV_VARS so the frontend
      # production server can start under `next start` for E2E tests.
      NEXT_PUBLIC_NETWORK: testnet
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_CONTRACT_AD_REGISTRY: PLACEHOLDER
      NEXT_PUBLIC_CONTRACT_ANALYTICS_AGGREGATOR: PLACEHOLDER
      NEXT_PUBLIC_CONTRACT_AUCTION_ENGINE: PLACEHOLDER
      # Syntactically valid (StrKey-checksummed) but undeployed contract id —
      # the campaign-creation E2E spec needs `new Contract(...)` to construct
      # without throwing so it can reach (and mock) the real RPC call.
      NEXT_PUBLIC_CONTRACT_CAMPAIGN_ORCHESTRATOR: CBRMBFTYTXZCORHZRHSBG5OWFUHDZZLGULAM6EERQYKPKJKGFKQTAMQV
      NEXT_PUBLIC_CONTRACT_DISPUTE_RESOLUTION: PLACEHOLDER
      NEXT_PUBLIC_CONTRACT_ESCROW_VAULT: PLACEHOLDER
      NEXT_PUBLIC_CONTRACT_FRAUD_PREVENTION: PLACEHOLDER
      NEXT_PUBLIC_CONTRACT_GOVERNANCE_DAO: PLACEHOLDER
      NEXT_PUBLIC_CONTRACT_GOVERNANCE_TOKEN: PLACEHOLDER
      NEXT_PUBLIC_CONTRACT_IDENTITY_REGISTRY: PLACEHOLDER
      NEXT_PUBLIC_CONTRACT_PAYMENT_PROCESSOR: PLACEHOLDER
      NEXT_PUBLIC_CONTRACT_PRIVACY_LAYER: PLACEHOLDER
      NEXT_PUBLIC_CONTRACT_PUBLISHER_REPUTATION: PLACEHOLDER
      NEXT_PUBLIC_CONTRACT_PUBLISHER_VERIFICATION: PLACEHOLDER
      NEXT_PUBLIC_CONTRACT_REVENUE_SETTLEMENT: PLACEHOLDER
      NEXT_PUBLIC_CONTRACT_REWARDS_DISTRIBUTOR: PLACEHOLDER
      NEXT_PUBLIC_CONTRACT_SUBSCRIPTION_MANAGER: PLACEHOLDER
      NEXT_PUBLIC_CONTRACT_TARGETING_ENGINE: PLACEHOLDER
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install workspace dependencies
        run: npm ci
      - name: Build shared packages
        run: npm run build:shared
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: frontend
