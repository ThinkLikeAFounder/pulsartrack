name: Deploy to Testnet

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'scripts/deploy.sh'
      - 'scripts/initialize.sh'
      - '.github/workflows/deploy-testnet.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown

      # The release WASM build is the slowest job in this workflow; caching the
      # registry and target dir keeps redeploys from recompiling every crate.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # A prebuilt release binary, instead of compiling the CLI from source.
      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v23.0.1

      - name: Build contract WASMs
        run: cargo build --release --target wasm32-unknown-unknown

      # The deployer key is a stable repository secret, so every deployment is
      # owned by a key the team holds and admin functions stay usable.
      - name: Import deployer identity
        env:
          STELLAR_DEPLOYER_SECRET: ${{ secrets.STELLAR_DEPLOYER_SECRET }}
        run: |
          if [ -z "$STELLAR_DEPLOYER_SECRET" ]; then
            echo "::error::Repository secret STELLAR_DEPLOYER_SECRET is not set"
            exit 1
          fi
          echo "$STELLAR_DEPLOYER_SECRET" | stellar keys add pulsartrack-deployer --secret-key

      - name: Run deployment script
        run: ./scripts/deploy.sh
        env:
          STELLAR_NETWORK: testnet
          STELLAR_IDENTITY: pulsartrack-deployer

      # The deployer identity is the admin, so the contracts come up initialized
      # with a known admin instead of being left unadministrable.
      - name: Initialize contracts
        run: ./scripts/initialize.sh --network testnet --identity pulsartrack-deployer
        env:
          STELLAR_NETWORK: testnet
          STELLAR_IDENTITY: pulsartrack-deployer

      # Deployment records are uploaded rather than pushed to main, which
      # branch protection may reject.
      - name: Upload deployment records
        uses: actions/upload-artifact@v4
        with:
          name: deployment-records
          path: deployments/
