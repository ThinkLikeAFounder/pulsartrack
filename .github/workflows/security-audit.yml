name: Security Audit

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sundays
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Cargo Audit
        run: cargo audit
        continue-on-error: true
        id: cargo

      - name: Backend Audit
        run: npm run audit
        working-directory: backend
        continue-on-error: true
        id: backend

      - name: Frontend Audit
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true
        id: frontend

      - name: Write audit summary and enforce result
        if: always()
        env:
          CARGO_OUTCOME: ${{ steps.cargo.outcome }}
          BACKEND_OUTCOME: ${{ steps.backend.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
        run: |
          {
            echo "## Security audit"
            echo "| Scanner | Result |"
            echo "|---|---|"
            echo "| Cargo | ${CARGO_OUTCOME} |"
            echo "| Backend | ${BACKEND_OUTCOME} |"
            echo "| Frontend | ${FRONTEND_OUTCOME} |"
          } | tee audit-summary.md >> "$GITHUB_STEP_SUMMARY"
          test "$CARGO_OUTCOME" = success && test "$BACKEND_OUTCOME" = success && test "$FRONTEND_OUTCOME" = success

      - name: Upload audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-summary
          path: audit-summary.md

      - name: Create or update security audit issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Scheduled security audit failed';
            const body = `The scheduled audit failed in run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. Review the uploaded audit-summary artifact and close this issue after remediation.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security-audit',
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['security-audit'] });
            }
