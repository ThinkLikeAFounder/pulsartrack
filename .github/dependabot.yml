# The workflow actions are pinned to full commit SHAs (see `ci.yml`,
# `deploy-testnet.yml`, `security-audit.yml`). Dependabot is what keeps those
# pins moving: it rewrites the SHA and the trailing `# vX.Y.Z` comment together,
# so a pin never silently ages into a version with a known advisory.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - devops
